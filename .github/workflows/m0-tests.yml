name: M0 tests

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [feature/m0-foundation, develop, main]

permissions:
  contents: read

jobs:
  m0-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Install FFmpeg and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -r requirements.txt
      - name: Verify real media tools and run the M0 suite
        run: |
          ffmpeg -version
          ffprobe -version
          python -m pytest -q --tb=short --junitxml=/tmp/m0-results.xml
      - name: Require all 26 tests without skips
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          suites = ET.parse('/tmp/m0-results.xml').getroot().findall('testsuite')
          totals = {key: sum(int(s.get(key, 0)) for s in suites)
                    for key in ('tests', 'failures', 'errors', 'skipped')}
          print(totals)
          assert totals == {'tests': 26, 'failures': 0, 'errors': 0, 'skipped': 0}, totals
          PY
