name: M0 tests

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [feature/m0-foundation, feature/m1-ocr-translation, develop, main]

permissions:
  contents: read

jobs:
  m0-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Install FFmpeg and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -r requirements.txt
      - name: Verify real media tools and run the M0 suite
        run: |
          ffmpeg -version
          ffprobe -version
          python -m pytest tests/test_m0.py tests/test_dashboard.py -q --tb=short --junitxml=/tmp/m0-results.xml
      - name: Require all 26 tests without skips
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          suites = ET.parse('/tmp/m0-results.xml').getroot().findall('testsuite')
          totals = {key: sum(int(s.get(key, 0)) for s in suites)
                    for key in ('tests', 'failures', 'errors', 'skipped')}
          print(totals)
          assert totals == {'tests': 26, 'failures': 0, 'errors': 0, 'skipped': 0}, totals
          PY

  m1-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Install M1 CPU dependencies (no models)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -r requirements-m1.txt
      - name: Test M1 services, migrations, supervisor and populated review UI
        run: |
          ffmpeg -version
          ffprobe -version
          python -m pytest -q --tb=short --ignore=tests/test_m0.py --ignore=tests/test_dashboard.py --ignore=tests/test_m1_real.py --ignore=tests/test_m2.py --ignore=tests/test_m2_real.py --ignore=tests/test_m3.py --ignore=tests/test_m3_real.py --ignore=tests/test_m4.py --ignore=tests/test_m4_real.py --junitxml=/tmp/m1-results.xml
      - name: Require deterministic M1 tests without skips
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          suites = ET.parse('/tmp/m1-results.xml').getroot().findall('testsuite')
          totals = {key: sum(int(s.get(key, 0)) for s in suites)
                    for key in ('tests', 'failures', 'errors', 'skipped')}
          print(totals)
          assert totals['tests'] >= 79 and totals['failures'] == totals['errors'] == totals['skipped'] == 0, totals
          PY

  m2-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Install CPU renderer and system fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install -r requirements-m2.txt
      - name: Test compositor, persistence, UI and actual FFmpeg exports
        run: python -m pytest tests/test_m2.py -q --tb=short --junitxml=/tmp/m2-results.xml
      - name: Require M2 tests without skips
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          suites = ET.parse('/tmp/m2-results.xml').getroot().findall('testsuite')
          totals = {key: sum(int(s.get(key, 0)) for s in suites)
                    for key in ('tests', 'failures', 'errors', 'skipped')}
          print(totals)
          assert totals['tests'] >= 31 and totals['failures'] == totals['errors'] == totals['skipped'] == 0, totals
          PY

  m3-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Install CPU audio dependencies (no model downloads)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install -r requirements-m3.txt
      - name: Verify extraction, synchronization, assembly, jobs and Studio
        run: python -m pytest tests/test_m3.py -q --tb=short --junitxml=/tmp/m3-results.xml
      - name: Require all deterministic M3 tests without skips
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          suites = ET.parse('/tmp/m3-results.xml').getroot().findall('testsuite')
          totals = {key: sum(int(s.get(key, 0)) for s in suites)
                    for key in ('tests', 'failures', 'errors', 'skipped')}
          print(totals)
          assert totals['tests'] >= 38 and totals['failures'] == totals['errors'] == totals['skipped'] == 0, totals
          PY

  m4-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Install FFmpeg libass, fonts and CPU runtime (no models)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install -r requirements-m4.txt
      - name: Verify ASS, real mux/presets, artifact integration and export UI
        run: python -m pytest tests/test_m4.py -q --tb=short --junitxml=/tmp/m4-results.xml
      - name: Require deterministic M4 tests without skips
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          suites = ET.parse('/tmp/m4-results.xml').getroot().findall('testsuite')
          totals = {key: sum(int(s.get(key, 0)) for s in suites)
                    for key in ('tests', 'failures', 'errors', 'skipped')}
          print(totals)
          assert totals['tests'] >= 41 and totals['failures'] == totals['errors'] == totals['skipped'] == 0, totals
          PY
