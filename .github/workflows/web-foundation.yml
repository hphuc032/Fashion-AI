name: W1 Web foundation

on:
  pull_request:
    branches: [develop]
  push:
    branches: [feature/web-foundation-w1]

permissions:
  contents: read

jobs:
  windows-web-foundation:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Frozen Python Web installation
        run: |
          python -m pip install --require-hashes -r apps/api/requirements.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
      - name: Frozen frontend installation
        working-directory: apps/web
        run: npm ci
      - name: Verify real media tools for W2 fixtures
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --yes --no-progress --limit-output
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          ffmpeg -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ffprobe -version
      - name: Types, lint, components and production build
        working-directory: apps/web
        run: |
          npm run types:api
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code -- src/types/api.generated.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run lint
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
      - name: API, negative security and actual Windows lifecycle
        run: |
          $env:PYTHONPATH = Join-Path $PWD 'apps/api'
          python -B -m pytest -c apps/api/pytest.ini apps/api/tests -q -p no:cacheprovider --junitxml=web-results.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import xml.etree.ElementTree as E; s=E.parse('web-results.xml').getroot().findall('testsuite'); t={k:sum(int(x.get(k,0)) for x in s) for k in ('tests','failures','errors','skipped')}; print(t); assert t['tests']>=75 and t['failures']==t['errors']==t['skipped']==0"
      - name: Real two-service browser integration
        working-directory: apps/web
        run: |
          $env:FASHION_WEB_PYTHON = (Get-Command python).Source
          npx playwright install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:e2e
